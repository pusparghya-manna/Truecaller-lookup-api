<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TrueFind</title>
  <link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/assets/favicon-64.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" sizes="180x180">

<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="TrueFind home">
      <img class="brand-logo" src="/assets/truefind-icon.png" alt="TrueFind" width="40" height="40">
      <span class="brand-text">True<span>Find</span></span>
    </a>
  </header>

  <main>
    <div class="search-wrap">
      <span class="prefix">+91</span>
      <input id="number" type="tel" inputmode="numeric" autocomplete="tel" placeholder="Mobile number" maxlength="12" value="">
      <button class="search-btn" id="search" type="button" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
        </svg>
      </button>
    </div>

    <div class="status" id="status"></div>
    <div class="result-card" id="resultCard"></div>
  </main>

  <footer>
    <div class="footer-links">
      <a href="/pages/privacy.html">Privacy</a>

      <a href="/pages/disclosure.html">Responsible Disclosure</a>
      <a href="/pages/directory.html">Directory</a>
      <a href="/pages/conduct.html">Code of Conduct</a>

  <!-- API key popup -->
  <div class="modal-overlay" id="keyModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">Enter API key</h2>
      <p>Your API key is stored only in this browser and sent with each search. It is never shown on the page after you save it.</p>
      <input id="modalKey" type="password" autocomplete="off" placeholder="Paste your API key">
      <div class="modal-error" id="modalError"></div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="modalCancel">Cancel</button>
        <button type="button" class="btn-primary" id="modalSave">Save &amp; continue</button>
      </div>
    </div>
  </div>
